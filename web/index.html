<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>風船ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 上部: ゲームの段階・残り時間・接続状態 ===== -->
  <header class="topbar">
    <h1 class="title">風船ゲーム</h1>
    <div class="phase" id="phase">-</div>
    <div class="timer" id="timer"></div>
    <div class="conn" id="conn" data-status="connecting">接続中…</div>
  </header>

  <!-- ===== 中央: 参加者の風船（5列 × 2段の10マス） =====
       マスの中身は app.js の createTile() でつくる -->
  <main class="stage">
    <!-- 待機中だけ出す案内（接続人数と、吹けているかの確認） -->
    <div class="waiting-info" id="waiting-info" hidden>
      <span class="player-count" id="player-count"></span>
      <span>チューブに息を吹いて、自分のバーが動くか確認しよう</span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">接続している子機はありません</p>

    <!-- Node-RED との接続が切れたときに出す（風船は最後に届いた状態のまま止まるため） -->
    <div class="conn-lost" id="conn-lost" hidden>
      <p class="conn-lost-title">Node-RED との接続が切れました</p>
      <p class="conn-lost-sub">再接続しています…</p>
    </div>

    <!-- 終了したら風船の上に重ねて出す順位表（行は app.js の renderRanking() でつくる） -->
    <div class="ranking" id="ranking" hidden>
      <h2 class="ranking-title">結果</h2>
      <ol class="ranking-list" id="ranking-list"></ol>
      <p class="ranking-none" id="ranking-none">割れた人はいませんでした</p>
    </div>
  </main>

  <!-- ===== カウントダウン（3・2・1 → スタート！）を画面中央に大きく出す ===== -->
  <div class="countdown" id="countdown" hidden>
    <span class="countdown-text" id="countdown-text"></span>
  </div>

  <!-- ===== 下部: 講師の操作ボタン ===== -->
  <footer class="controls">
    <button type="button" id="start-btn">スタート</button>
    <button type="button" id="reset-btn">リセット</button>
  </footer>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
